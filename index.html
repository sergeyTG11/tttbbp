<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мини-Игра для Telegram</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .game-container {
            text-align: center;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 80%;
            max-width: 350px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #3498db;
        }

        .score-box {
            font-size: 40px;
            font-weight: bold;
            margin: 20px 0;
            color: #2ecc71;
        }

        .click-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(145deg, #3498db, #2980b9);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
            font-size: 50px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .click-btn:active {
            transform: scale(0.92);
        }

        .user-name {
            font-size: 14px;
            color: #aaa;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 id="greeting">Привет!</h1>
        <div class="score-box" id="score">0</div>
        <button class="click-btn" id="clickBtn">💎</button>
        <div class="user-name" id="username">Загрузка игрока...</div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем приложение на весь экран

        let score = 0;
        const scoreDisplay = document.getElementById('score');
        const clickBtn = document.getElementById('clickBtn');
        const usernameDisplay = document.getElementById('username');
        const greetingDisplay = document.getElementById('greeting');

        // Получаем данные о пользователе от Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            usernameDisplay.textContent = `@${user.username || 'игрок'}`;
            greetingDisplay.textContent = `Привет, ${user.first_name}!`;
        } else {
            usernameDisplay.textContent = "Запущено вне Telegram";
        }

        // Логика клика
        clickBtn.addEventListener('click', () => {
            score++;
            scoreDisplay.textContent = score;
            
            // Легкая вибрация на телефоне при клике (работает в Telegram)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Сообщаем Telegram, что приложение готово к работе
        tg.ready();
    </script>
</body>
</html>
