<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stickman Battle Fixed</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #111; color: #fff;
            font-family: sans-serif; overflow: hidden; user-select: none;
            -webkit-user-select: none; touch-action: none;
        }
        #gameCanvas {
            display: block; background: #222;
            border-bottom: 4px solid #444;
            width: 100vw; height: 55vh;
        }
                .controls {
            display: flex; justify-content: space-between; align-items: center;
            height: 45vh; padding: 0 25px; background: #1a1a1a; box-sizing: border-box;
        }
        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { background: rgba(255, 255, 255, 0.4); }
        .move-block { display: flex; gap: 25px; }
        .move-btn { width: 90px; height: 90px; }
        .action-btn {
            width: 110px; height: 110px; border-radius: 50%;
            background: rgba(231, 76, 60, 0.3); border-color: rgba(231, 76, 60, 0.6);
            font-size: 22px;
        }
        .action-btn:active { background: rgba(231, 76, 60, 0.7); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div class="controls">
        <div class="move-block">
            <div class="btn move-btn" id="btnLeft">◀</div>
            <div class="btn move-btn" id="btnRight">▶</div>
        </div>
        <button class="btn action-btn" id="btnAttack">УДАР</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Точная подстройка под размеры экрана
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.55;
        const groundY = canvas.height - 10;

        // Игрок (Зеленый боец)
        const player = {
            x: 60, y: groundY - 60, width: 40, height: 60,
            speed: 5, isAttacking: false, attackTimer: 0, direction: 1
        };

        // Враг (Красный боец)
        const enemy = {
            x: canvas.width - 100, y: groundY - 60, width: 40, height: 60,
            maxHp: 100, hp: 100, speed: 1.5
        };

        let keys = { left: false, right: false };
                const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnAttack = document.getElementById('btnAttack');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; player.direction = -1; });
        btnLeft.addEventListener('touchend', () => keys.left = false);

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; player.direction = 1; });
        btnRight.addEventListener('touchend', () => keys.right = false);

        btnAttack.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!player.isAttacking) {
                player.isAttacking = true;
                player.attackTimer = 12;
                checkHit();
            }
        });

        function checkHit() {
            const reach = 50;
            if (player.direction === 1) { // Удар направо
                if (player.x + player.width + reach >= enemy.x && player.x <= enemy.x + enemy.width) {
                    hitEnemy();
                }
            } else { # Удар налево
                if (player.x - reach <= enemy.x + enemy.width && player.x + player.width >= enemy.x) {
                    hitEnemy();
                }
            }
        }

        function hitEnemy() {
            enemy.hp -= 20;
            if (enemy.hp < 0) enemy.hp = 0;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            enemy.x += player.direction * 25; // Отлет врага назад
        }
                function update() {
            if (keys.left) player.x -= player.speed;
            if (keys.right) player.x += player.speed;

            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            if (enemy.hp > 0) {
                if (enemy.x > player.x + player.width) enemy.x -= enemy.speed;
                else if (enemy.x + enemy.width < player.x) enemy.x += enemy.speed;
            } else {
                setTimeout(() => {
                    enemy.hp = 100;
                    enemy.x = Math.random() > 0.5 ? 20 : canvas.width - 60;
                }, 1500);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем Игрока (Зеленый квадрат)
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Рисуем Оружие (Желтая палка)
            ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 6;
            ctx.beginPath();
            if (player.isAttacking) {
                ctx.moveTo(player.x + player.width/2, player.y + player.height/2);
                ctx.lineTo(player.x + player.width/2 + (player.direction * 50), player.y + player.height/2);
            } else {
                ctx.moveTo(player.x + (player.direction === 1 ? player.width : 0), player.y + 20);
                ctx.lineTo(player.x + (player.direction === 1 ? player.width + 15 : -15), player.y + player.height);
            }
            ctx.stroke();

            // Рисуем Врага (Красный квадрат)
            if (enemy.hp > 0) {
                ctx.fillStyle = "#e74c3c";
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

                // Полоска здоровья над врагом
                ctx.fillStyle = "#444"; ctx.fillRect(enemy.x - 5, enemy.y - 15, enemy.width + 10, 6);
                ctx.fillStyle = "#e74c3c"; ctx.fillRect(enemy.x - 5, enemy.y - 15, ((enemy.hp / 100) * (enemy.width + 10)), 6);
            } else {
                ctx.fillStyle = "#e74c3c"; ctx.font = "bold 16px sans-serif";
                ctx.fillText("УБИТ!", enemy.x - 5, enemy.y + 30);
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        tg.ready(); gameLoop();
    </script>
</body>
</html>
